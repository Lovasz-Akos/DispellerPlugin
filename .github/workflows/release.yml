name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_NAME: Dispeller
  DALAMUD_HOME: ${{ github.workspace }}/.dalamud

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DALAMUD_HOME" | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath "$env:DALAMUD_HOME" -Force

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            (git describe --tags --abbrev=0)
          }

          if ((git rev-list -n 1 $tag) -ne (git rev-parse HEAD)) {
            throw "Tag '$tag' does not point at the current master HEAD. Tag the commit you want to release."
          }

          $manifest = Get-Content "bin/Release/$env:PLUGIN_NAME.json" -Raw | ConvertFrom-Json

          if ([version]($tag -replace '^v', '') -ne [version]$manifest.AssemblyVersion) {
            throw "Tag '$tag' does not match built AssemblyVersion '$($manifest.AssemblyVersion)'. Bump <Version> in $env:PLUGIN_NAME.csproj to match the tag."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "assembly_version=$($manifest.AssemblyVersion)" >> $env:GITHUB_OUTPUT
          "api_level=$($manifest.DalamudApiLevel)" >> $env:GITHUB_OUTPUT

      - name: Stage release artifact
        shell: pwsh
        run: Copy-Item "bin/Release/$env:PLUGIN_NAME/latest.zip" "$env:PLUGIN_NAME.zip"

      - name: Update repo.json
        shell: pwsh
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          ASSEMBLY_VERSION: ${{ steps.ver.outputs.assembly_version }}
          API_LEVEL: ${{ steps.ver.outputs.api_level }}
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$env:PLUGIN_NAME.zip"
          $entry = (Get-Content repo.json -Raw | ConvertFrom-Json)[0]
          $entry.AssemblyVersion     = $env:ASSEMBLY_VERSION
          $entry.DalamudApiLevel     = [int]$env:API_LEVEL
          $entry.DownloadLinkInstall = $url
          $entry.DownloadLinkTesting = $url
          $entry.DownloadLinkUpdate  = $url
          $entry | ConvertTo-Json -Depth 10 -AsArray | Set-Content repo.json -Encoding utf8

      - name: Commit repo.json
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          if (git diff --cached --name-only) {
            git commit -m "chore: update repo.json for ${{ steps.ver.outputs.tag }}"
            git push origin HEAD:master
          } else {
            Write-Host "repo.json already up to date."
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: ${{ env.PLUGIN_NAME }}.zip
          generate_release_notes: true
